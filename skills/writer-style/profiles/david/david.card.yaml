voice: david
role: primary
register: medium-2020-practical
persona_ref: david.md
exemplars_ref: exemplars/david/
themes_ref: themes.md         # the substance bank — pull FITTING stances/anecdotes instead of recycling exemplar content

# Dials curated from evidence/david.profile.json (card_suggestions) + the persona + the adversarial pass.
# Scalar dials are MEASURED; the one mapping dial carries source: persona_override with its measured value
# and reasoning, so the override is auditable rather than hidden.
dials:
  sentence_length: { median: 16, short_punch_floor: 6, long_reach: 33, burstiness_min: 8 }
    # WRITER: typical sentence ~16-17 words. Force >=1 short punch and >=1 long reach per section, but let
    # them CLUMP — his short sentences appear in only four places (answering his own question, list stems,
    # announcement stubs, flat punches) and his long ones only at openers and cause-chains, never in closers.
    # VALIDATOR: corpus stdev measured 11.5; profiler suggested 7 (conservative for short pieces); set to 8 —
    # high enough to catch metronomic output, low enough that a genuinely terse 300-word piece is not failed.
  readability_grade: { min: 7, max: 11 }
    # WRITER: FK 7.5-9.0 is the centre (the procrastination + selling pair). Up to ~10.5 for a roundup, and
    # ONLY by adding named-thing nouns (book titles, tool names) — never by adding -tion abstractions.
    # PM/delivery artifacts sit at FK 9-10. Anything at 12+ is the off-register 2025 consultant voice.
  lexical_density: medium                 # content-word ratio 0.50 — do not pack every sentence.
  hedge_boost_lean: -1                    # measured. "around 8 months", "around 150 pages", "a couple of",
                                          # "I like to think that" — he softens absolutes, including other people's.
  person_perspective: { first: 39, second: 39, third: 22 }
    # Balanced I/you. Per-post rates run you 13-48/1k and I 14-31/1k — a WIDE band, not a floor.
  example_density: { value: high, source: persona_override, measured: low,
                     why: "the announced first-person worked instance ('Let me give you an example:' -> a named tool, a real date, a real hour, a traced consequence) is his ONLY evidence type; a marker count of 'for example' misses all of it" }
  analogy_density: none
    # MEASURED 0.0/1k. Not a preference — there is not one author-built analogy in the corpus. The ban covers
    # figurative VERBS too ("rework eats your schedule" is off-voice). He instantiates; he does not map.
  definition_density: { enum: just-in-time, per_1k: 5.1 }
    # He defines by PLAIN RESTATEMENT the moment a term appears ("Procrastination is the action of delaying
    # or postponing something."), then moves on. Never a glossary, never front-loaded.
  code_density: none                      # 0 fenced blocks, 0 inline code spans in the target register.
  rhetorical_question_rate: medium        # ~4-5 '?' per 1k. FORMAT-GATED: concentrated in how-to pieces; the
                                          # lessons-learned post has zero. A retrospective may carry none.
  booster_rate_per_200w: 1
    # The body is flat in its ARGUMENT, not its ADJECTIVES. ~1 booster per 200 words, always aimed at someone
    # ELSE's work: valuable / super / amazing / highly / treasure chest / a LOT. Zero boosters reads colder
    # than any real post. Enthusiasm aimed at his OWN result is off-voice.
  seam_rate_per_1k: { min: 8, max: 10 }
    # Non-native-English seams per 1k of HIS OWN prose (exclude block-quoted source material from the
    # denominator). See david.md 5.2 for the classes and the five rules that matter more than the rate.
    # Zero seams is a tell that the piece was smoothed.

favor:
  connectives: [So, But, And, Then, Instead, "That way,", "In order to", "After", "Since", "First,",
                "Second,", "Another thing we can do", "Going back to", "Let's", "But first,", "Let's say that"]
  moves:
    - "reader-qualification open: 'If you are X … this article is for you' — no scene, no statistic, no provocation"
    - "announce the count, THEN name the units (3 tools, a 4 step process) — the names become the headings"
    - "borrowed law -> personal warrant: let a real source speak for a paragraph, then certify it with your own use"
    - "amend a source in one word, never attack it ('selling is easy' -> 'selling is easier')"
    - "question hinge: a <=6-word question as a heading or mid-paragraph, answered in the very next line"
    - "announced worked instance with a named tool and a real date — gated on the fact-sheet (see markers)"
    - "instantiate, never analogize — replay a concrete case instead of mapping to a second domain"
    - "define by plain restatement, immediately, then move on"
    - "rework as the stake; money, mental load and dropped commitments as the other three levers"
    - "confess a limit and ship a free pointer — an admission that ships nothing is the wrong shape"
    - "credit by exact name (collaborator, manager, tool, channel) — crediting is a reflex"
    - "hand off, never conclude: no summary paragraph, no 'in conclusion', end on a pointer + the ask"
    - "leave one section that does not pull its weight (david.md 5.6) — a clean arc is the tell"

avoid:
  # These are NOT generic AI-slop bans. Each is measured at ZERO in 3,710 words of the target register and
  # present in the off-register 2025 posts, whose prose is excluded on purpose. They are the specific
  # vocabulary that turns this voice into the consultant register it must not be.
  words: [fundamentally, typically, comprehensive, sophisticated, nuanced, systematically, unprecedented,
          revolutionize, revolutionized, leverage, delve, utilize,
          "it's important to note", "in today's fast-paced world", "in the realm of", "a testament to",
          "no more, no less", "analysis paralysis", "pressure-test", "blast radius"]
  connectives: ["However,", "Moreover,", "Furthermore,", "Additionally,", "In addition,", "In conclusion,",
                "That said,", "First and foremost", "Consider,"]
  # note: "In addition," DOES appear once in the corpus — inside a block quote from the sales book, not in
  # David's own prose. Banned as authorial voice; a genuine block quote is not the writer's sentence.

ai_tells:
  - { id: false-antithesis, cap_per_800w: 1 }
    # MEASURED ZERO in the target register — "X is not for A, it's for B" / "not just X, but Y" has no
    # instance in 3,710 words. Not a stylistic preference: non-native fluency does not produce that turn;
    # a model does. HONESTY NOTE: the lint floors this check at 1 (`max(1, cap*nw/800)`), so a card value
    # of 0 would be indistinguishable from 1 and would silently do nothing. The real ban is the prose rule
    # in david.md §2 — "if a sentence would work as a pull quote, flatten it" — and it is a write-time
    # check, not a lint-enforceable one. The lint here catches only the second one.
  - { id: em-dash-overuse, max: 2, kind: measured }
    # NOT the usual generic guardrail: measured 4 em-dashes in 3,710 words, of which TWO are inside quoted
    # material and TWO are in his own image captions. ZERO in body prose. 2/1k is already generous.
  - { id: uniform-cadence, min: 8 }
  - { id: delve-class, cap: 0 }
  - { id: even-enthusiasm, rule: tail-loaded }
    # INVERTED from the usual spike-at-the-edges topology. Cold open (0 '!' in the first paragraph, 5/5),
    # heat at the END. The body still carries booster warmth (see dials.booster_rate_per_200w).

# Signature-marker dosage + context gates. Enforced by validate_voice.py density (pass --facts <fact-sheet>
# so gates are checked against the BRIEF, never the draft — a forced insertion contains its own lexemes and
# would self-license). Per-piece budgets (per_words: 0) do NOT scale with length — the anti-compounding rule.
# Caps seeded from the corpus + the D1/D2 adversarial pass; no empirical calibration round has run yet, so
# tics stay advisory. Promote to enforce: hard only through a logged calibration round.
markers:
  - id: fabricated-instance-guard
    class: identity
    # class MUST be identity, not structural: validate_voice.py escalates a gate MISS only for
    # class == identity (marker_density, the `mcls == "identity" and gate_status == "MISS"` branch).
    # As `structural` this gate parsed, displayed MISS, and then passed the draft — inert. Verified.
    # cap 1 (not 0) so a date the fact-sheet ACTUALLY supplies sits inside budget and stays silent;
    # an unsupplied one trips the identity+MISS branch and hard-fails. cap 0 would flag both.
    patterns: ["last week", "last month", "the other day", "a few weeks ago", "when i was at", "on a call last"]
    cap: 1
    per_words: 0
    gate: ["last week", "last month", "the other day", "a few weeks ago", "date", "week of", "we shipped", "timeline"]
    enforce: hard
    fallback: "THE FABRICATION GATE. A dated first-person instance must come from the fact-sheet, not from plausibility — the blind-compare test invented 'last week we decided on a call to cut a screen' and it passed every other gate. With no supplied date/tool/outcome, demonstrate the procedure in the SECOND person instead ('write the number you guessed somewhere you will find it again'). See david.md 5b."
  - id: book-handoff
    class: identity
    # class identity for the same reason as fabricated-instance-guard above — as `structural` the
    # hard gate never fired. Patterns must not nest: "the book recommendation for this article"
    # contains "book recommendation" and double-counted the corpus's own phrase into a false fail.
    # gate: "article"/"paper"/"course" were REMOVED — every Medium brief contains the word "article",
    # so the gate stood permanently open and licensed an invented title. Verified by probe.
    patterns: ["book recommendation", "i recommend this book", "i will recommend a book", "changed my life"]
    cap: 1
    per_words: 0
    gate: [book, books, author, "wrote in", chapter, "youtube channel", podcast, "blog post", "article by"]
    enforce: hard
    fallback: "Inventing a book title to complete the ritual is FABRICATION, not style — the worst failure this pack can produce. Only fires when a real title+author is in the fact-sheet. Otherwise hand off what you actually have (a link, a tool, a channel), or skip the section and name the break the way he did ('In this article, I will recommend a Youtube channel over a book. That is because…')."
  - id: closing-ask
    class: signoff
    patterns: ["let me know your thoughts", "let me know what you thought", "let me know your opinions",
               "let me know which", "let me know how", "feel free to leave feedback",
               # "let me know if" REMOVED: ordinary PM English ("let me know if scope changes") -> false hard fail
               "give it a few claps", "grow together", "don't be shy and share"]
    cap: 1
    per_words: 0
    enforce: hard
    fallback: "ONE closing ask, at the very end. 'Let me know' opens the closer in 5/5 posts — but everything after it VARIES: the full four-beat recipe (Let me know -> in the comments -> a sentence-initial 'If you…' -> terminal !/!!) holds in only 3/5, and only 2/5 end on an exclamation mark at all. One post ends with no terminal punctuation, one on ':)'. Across a batch: at most 3 in 5 run the full recipe, and no two consecutive pieces share closer wording. Let a piece end untidily."
  - id: comments-invite
    class: refrain
    patterns: ["in the comments"]   # "in the comments below" REMOVED: nests, double-counted one real closer
    cap: 2
    per_words: 0
    fallback: "Two maximum: the closing ask, plus at most ONE mid-body ask per ~1,200 words, and only right after you have shown the reader something (a before/after, a screenshot, a list) — 'What do you think about the difference? Let me know in the comments below!'"
  - id: double-exclamation
    class: tic
    patterns: ["!!"]
    cap: 1
    per_words: 0
    fallback: "At most one per piece, in the closer only, never mid-body — and only 3/5 real posts carry one at all. Zero is the common case."
  - id: brazil-portuguese-beat
    class: identity
    patterns: [portuguese, brazil, brasil, latam, "check my youtube channel"]
    # "brazilian" REMOVED (nests inside "brazil"); "behind the scenes" REMOVED (ordinary English, false-fires)
    cap: 1
    per_words: 0
    gate: [portuguese, brazil, brasil, brazilian, latam, "pt-br", "portuguese-speaking"]
    enforce: hard
    fallback: "When the brief is not for a Portuguese-speaking or Brazilian audience there is no such beat — just the post. Do not gesture at it."
  - id: employer-client-beat
    class: identity
    patterns: [kmino, lunos, "my software house", "mvp-in-a-box", "mvp in a box"]
    cap: 1
    per_words: 0
    gate: [kmino, lunos, "software house", agency, "mvp-in-a-box"]
    enforce: hard
    fallback: "Naming a real employer or client in an unrelated piece is a disclosure risk, not a flourish. Only when the fact-sheet names them. The Kmino price list (themes.md B12) is additionally stale-dated — re-verify before any reuse."
  - id: game-jam-anecdote
    class: identity
    patterns: ["game jam", "ludum dare", "itch.io", "delivery doggo", "beginners circle",
               "beginner's circle", brackeys, "27 scripts"]
    # "game jams" REMOVED (nests in "game jam"); "pixel art" REMOVED (it is also a gate keyword)
    cap: 1
    per_words: 0
    gate: ["game", "game dev", "game development", "game engine", jam, hackathon, "side project",
           "first game", "pixel art"]
    # "unity" REMOVED — gates are raw substring matches, so it fired on COMMUNITY and OPPORTUNITY
    # (probe-verified). Same class of bug removed from partner-credit, pm-credential and snooze below.
    enforce: hard
    fallback: "The pack's highest-burn anecdote (themes.md B1). Gate it on a piece that genuinely involves game dev, a jam/hackathon, or learning a craft from zero. Otherwise pull a fitting item from themes.md, or use the piece's own material."
  - id: partner-credit
    class: identity
    patterns: ["my girlfriend", "my partner did", "she did the assets"]
    cap: 1
    per_words: 0
    gate: ["game jam", "game development", "delivery doggo", "pixel art", "personal project"]
    enforce: hard
    fallback: "Never in a professional/PM piece. It belongs only to the game-jam collaboration. Credit somebody who is actually in the fact-sheet instead — crediting is the reflex, not this particular person."
  - id: pm-credential
    class: identity
    patterns: ["around 8 months", "as a project manager on software", "as a project manager for"]
    cap: 1
    per_words: 0
    gate: ["project management", "project manager", management, estimation, delivery, "team process"]
    # bare "pm" REMOVED — it matched deveLOPMENt, deployment, equipment
    fallback: "The credential line, always stated as a DOWNGRADE. One per piece, and do not repeat it inside a cluster or batch (themes.md B4)."
  - id: snooze-anecdote
    class: analogy
    patterns: ["friday, june 26", "june 26", "at 8 am", "snooze", "snoozing"]
    cap: 1
    per_words: 0
    gate: [email, inbox, calendar, gmail, snooze, commitment, commitments, "follow up", "follow-up",
           "estimated time"]
    # bare "eta" REMOVED — it matched dETAils, bETA, mETAdata
    fallback: "His most reusable small anecdote — and exemplar 03 already spends it. Only on email/calendar/commitment topics; otherwise it is the exemplar trap (rhythm donors, never content donors)."
  - id: helped-answer-question
    class: refrain
    patterns: ["helped me answer the question", "helps to answer the question", "helped me to answer the question"]
    cap: 1
    per_words: 0
    fallback: "SINGLE-POST TIC — this is the books post's list template (3 uses there, 0 elsewhere), NOT the general book-handoff frame. Use at most once, and only in a resource roundup. Never in a PM or how-to piece."
  - id: lots-of
    class: tic
    patterns: ["lots of"]
    cap: 1
    per_words: 0
    fallback: "SINGLE-POST TIC — 6 uses, all in one post, echoing its own title; 0 in the other four. 'a lot of' is the general form."
  - id: valuable-information
    class: tic
    patterns: ["valuable information", "super valuable"]
    # NB: patterns must not overlap — "lots of valuable" and "valuable source of information" both
    # double-count the same occurrence of "valuable information" and were removed for that reason.
    cap: 1
    per_words: 0
    fallback: "A real booster and part of the body's normal warmth (dials.booster_rate_per_200w) — but the exact phrase repeats; rotate to 'super valuable', 'amazing', 'highly recommend', or just say what the thing gave you."
  - id: treasure-metaphor
    class: analogy
    patterns: ["hidden treasure", "treasure chest"]
    cap: 1
    per_words: 0
    fallback: "His two self-authored figures are the same move twice; never both in one piece, and at most one per batch. His measured analogy rate is 0.0/1k — these scare-quoted images are the whole figurative range."
  - id: deferral-refrain
    class: refrain
    patterns: ["i won't go over", "i could stay the whole day", "in a future article",
               "more in-depth article", "that is a whole other article"]
    # "will be written in the future" REMOVED: co-occurs with "more in-depth article" in his one real
    # instance ("A more in-depth article about this will be written in the future") -> counted 2 for 1 move
    cap: 1
    per_words: 0
    fallback: "The confess-a-limit-and-ship-a-pointer move. One per piece — and it must ship an actual pointer, or it is the wrong shape."
  - id: and-comma-splice
    class: tic
    patterns: [" and, "]   # leading space required: bare "and, " fired on demAND, / PolANDd, / brANDd,
    cap: 1
    per_words: 0
    fallback: "Measured 4 instances in 3,710 words, in 2 of 5 posts. It is a residue, not a signature — one per piece, never two. Position is NOT restricted: one of the four attested instances is the closing ask itself ('in the comments below and, let me know which is YOUR favorite sales book!'), so a closer is a legitimate site for it (david.md 5.2 rule 1)."
  - id: smiley
    class: tic
    patterns: [":)"]
    cap: 1
    per_words: 0
    fallback: "One instance in the whole corpus. Roughly one piece in four, never a per-piece stamp."

notes:
  corpus: >
    THIN, AND SINGLE-ERA — read this before trusting the dials. The on-register sample is 5 Medium posts:
    3,707 body words after removing provenance headers and Medium's cross-post footer (the first run reported
    3,927 including that chrome); ~3,150 after also excluding block-quoted book material, which is
    professionally edited English and is NOT David's prose.
    One platform (Medium), one year (2020), one genre (the personal-practical post). No corpus at all for:
    long-form over ~950 words, anything code-bearing (0 fenced blocks, 0 inline spans), threads, video
    scripts, or announcements. Fidelity is corpus-bounded and grows only as more real on-register writing is
    added — never by stretching what is here.
  register_drift: >
    The same author measures FK 9.0 in 2020 (5 posts, 3,927w) and FK 14.0 in 2025 (2 posts, 3,497w), with
    median sentence length nearly unchanged (16 vs 18 words) — the drift is vocabulary, not rhythm. The owner
    chose the 2020 register; the 2022/2025 posts are SUBSTANCE-ONLY sources (themes.md). Analysis of the 2025
    posts found the non-native seam density collapsing ~4.5x EXCEPT inside the two first-person anecdotes,
    plus typographic artefacts a browser-typed draft does not produce — so their fluency is probably editorial
    or model smoothing rather than acquired polish. Do not model it. See david.md 7 for the translation table
    that gets 2025 PM substance into the 2020 voice.
  profiler_caveat: >
    FIXED (2026-09-03). The first profile run ingested files that still carried their 4-line provenance
    headers, so its signature_trigrams held scrape chrome ("author david potolski", "gmt url https") and its
    counts ran ~5% high; the dials below were re-derived by hand against cleaned body text and the trigram
    list was discarded. evidence/david.profile.json has since been REGENERATED from header- and footer-free
    body prose (the corpus tooling that produced it lives in git history at d7c4284, not in the tree):
    5 posts, 3,707 body words,
    median sentence 17w, FK 9.1 — i.e. the hand-derived dials were sound (FK moved 9.0 -> 9.1). The trigram
    list is now usable and corroborates the closer ritual independently: "let me know" x6, "in the comments"
    x5, "the comments below" x4.
  corpus_corroboration: >
    Two independent acquisition paths agree, which matters at this sample size. The RSS-derived bodies and
    the owner's hand-pasted page text (split and diffed by the tooling at d7c4284)
    land within +/-52 words on all five overlapping posts (selling -48, game +8, 2-tips +52, procrastination
    -22, mvp-scope +8), so the feed did not truncate and the extractor did not mangle. The paste covers only
    4 of the 5 style posts (it lacks "Some nice books…"), so style_clean/ remains authoritative.
  exemplars: >
    exemplars/david/ is the strongest signal — load ~4 per piece (ALWAYS the seam, 04) and lean on them.
    Two slots deliberately differ from the standard seven: "analogy" is replaced by "worked-example"
    (measured analogy rate 0.0/1k) and "verdict" by "question-hinge" (he never renders a verdict). FK across
    the bank runs 5.5 to 14.3 on the same author in the same year — that spread IS the burstiness. Rhythm
    donors, never content donors: substance comes from themes.md.
  themes_review: >
    SIGNED OFF 2026-09-03 by the owner. All 44 stances are live, including 41-44, which were previously
    low-confidence inferences shipped as DO NOT USE. Those four are now `owner-confirmed`: authorised to
    argue, but they carry NO verbatim receipt — write them as his position, never as a quotation, and never
    manufacture a receipt. Stances 43 and 44 keep a binding scope note (43 is not a security opinion;
    44's written method derives a point estimate from a range, so do not rewrite the formula to fit the
    stance). The banner at the top of themes.md remains binding.
  lint_exceptions: >
    "in order to" is on the validator's Tier-1 AI-tell list but is ATTESTED IDIOLECT here: it appears in
    4 of the 5 on-register posts (1-2x each). Treat the `tells` advisory for it as expected, not as a
    defect, and do NOT swap it to a bare "to" on David's behalf. Cap it at ~1 per 600 words so it stays a
    habit rather than a crutch. Related measured baseline, for judging any generated piece: across the five
    real posts, burstiness stdev ran 7.1-13.9 (one real post FAILS the >=8 target at 7.1), em-dash 0.0-2.3
    per 1k, false-antithesis 0-1. A generated piece landing inside those bands is matching the author, not
    the target.
  calibration: >
    No empirical calibration round has run for this voice. Every cap here is seeded from the corpus plus one
    adversarial pass (fidelity hawk + generate-and-blind-compare, both of which corrected real errors in the
    first draft — notably an overstated 5/5 closer recipe that is actually 3/5, and a fabricated anecdote
    that walked through the gates). Treat the numbers as a starting hypothesis, not a measured optimum, and
    change a cap only through a logged calibration round.
